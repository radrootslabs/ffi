[workspace]
members = ["crates/c", "crates/example", "crates/ffi", "crates/node", "crates/wasm"]
resolver = "3"

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99.0"
authors = ["Tyson Lupul <tyson@radroots.org>"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/radrootslabs/ffi"
homepage = "https://radroots.org"
publish = false

[workspace.dependencies]
radroots = { package = "radroots", path = "crates/example", version = "=0.0.0" }
uniffi = "=0.31.0"
napi = { version = "=3.13.0", default-features = false, features = ["napi8"] }
napi-derive = "=3.6.9"
napi-build = "=2.5.0"
wasm-bindgen = "=0.2.127"

[profile.release]
lto = "thin"
strip = "debuginfo"

[profile.c-release]
inherits = "release"
panic = "unwind"
